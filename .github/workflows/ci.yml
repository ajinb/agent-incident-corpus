name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests examples
      - name: Validate the corpus against the schema
        run: agent-incidents validate --strict
      - name: Test
        run: pytest -q
      - name: Demo runs offline
        run: agent-incidents demo
      - name: Regression gate — reference guards must contain every incident
        run: agent-incidents gate --guards reference
