[project]
name = "agent-incident-corpus"
version = "0.1.0"
description = "Public AI-agent production failures as a versioned, replayable regression corpus — and a CI gate that fails when your guardrails stop containing them."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["ai", "agents", "incidents", "reliability", "sre", "evaluation", "guardrails", "dataset"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/agent-incident-corpus"

[project.scripts]
agent-incidents = "agent_incident_corpus.cli:main"

[project.entry-points.pytest11]
agent_incident_corpus = "agent_incident_corpus.plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_incident_corpus"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
